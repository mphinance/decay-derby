name: Daily CSP Screener

on:
  schedule:
    # 6:00 AM ET = 11:00 AM UTC (EST) / 10:00 AM UTC (EDT)
    # Using 10:30 UTC to safely land in both EST/EDT windows
    - cron: "30 10 * * 1-5"  # Mon–Fri 6:30 AM ET

  # Allow manual trigger for testing
  workflow_dispatch:
    inputs:
      date:
        description: "Target date (YYYY-MM-DD, blank = today)"
        required: false
        default: ""
      dry_run:
        description: "Dry run (no file commit)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write  # needed to commit generated JSON back to repo

jobs:
  run-screener:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: screener/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r screener/requirements.txt

      - name: Determine target date
        id: date
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "target=${{ github.event.inputs.date }}" >> $GITHUB_OUTPUT
          else
            # Next trading day logic
            DOW=$(date +%u)  # 1=Mon ... 7=Sun
            if [ "$DOW" -eq 6 ]; then
              echo "target=$(date -d '+2 days' +%Y-%m-%d)" >> $GITHUB_OUTPUT
            elif [ "$DOW" -eq 7 ]; then
              echo "target=$(date -d '+1 day' +%Y-%m-%d)" >> $GITHUB_OUTPUT
            else
              echo "target=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Run CSP screener
        id: screener
        run: |
          DATE_ARG=""
          if [ -n "${{ steps.date.outputs.target }}" ]; then
            DATE_ARG="--date ${{ steps.date.outputs.target }}"
          fi

          DRY_ARG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_ARG="--dry-run"
          fi

          python screener/csp_scanner.py $DATE_ARG $DRY_ARG
          echo "date=${{ steps.date.outputs.target }}" >> $GITHUB_OUTPUT

      - name: Commit and push results
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "decay-derby-bot"
          git config user.email "bot@decay-derby.io"

          # Check if there are changes to commit
          if git diff --quiet docs/data/; then
            echo "No new data files — skipping commit"
            exit 0
          fi

          git add docs/data/daily/ docs/data/latest.json
          git commit -m "📊 Daily picks: ${{ steps.screener.outputs.date }}

          Automated CSP screener output.
          [skip ci]"
          git push

      - name: Summary
        if: always()
        run: |
          echo "### Decay Derby Screener Run 📊" >> $GITHUB_STEP_SUMMARY
          echo "- **Date:** ${{ steps.screener.outputs.date }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          if [ -f "docs/data/latest.json" ]; then
            LATEST=$(cat docs/data/latest.json | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('latest','?'))")
            echo "- **Latest data:** $LATEST" >> $GITHUB_STEP_SUMMARY
          fi
